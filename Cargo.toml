[workspace]
members = [
  "blocks/evm",
  "blocks/antelope",
  "blocks/cosmos",
  "blocks/beacon",
  "blocks/solana",
  "blocks/bitcoin",
  "blocks/starknet",
  "blocks/near",
  "blocks/arweave",
  "common",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.0.0"

[workspace.dependencies]
# `substreams` exports `#[no_mangle]` alloc/dealloc, so a single wasm must only
# link ONE version of it. Chain crates that still require `substreams ^0.6`
# (antelope, bitcoin, cosmos, near) pin `substreams = "0.6"` in their own
# Cargo.toml instead of using this workspace entry.
substreams = "0.7"
substreams-ethereum = "0.11"
substreams-antelope = "0.6"
substreams-solana = "0.15"
substreams-cosmos = "0.2"
substreams-bitcoin = "2.0"
substreams-near = "0.10"
# substreams 0.7 still targets prost 0.13; keep in lockstep so prost_types::Timestamp is shared.
prost = "0.13"
prost-types = "0.13"
serde_json = "1.0"
hex = "0.4"
