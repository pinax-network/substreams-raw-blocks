syntax = "proto3";

package pinax.arweave.v2;

import "google/protobuf/timestamp.proto";
import "sf/substreams/sink/sql/schema/v1/schema.proto";

// Raw Arweave block data, one table per repeated field, consumed directly by
// `substreams sink postgres`. Hashes/addresses/payloads are `bytes`
// (`--bytes-encoding base64` for the usual text form); big numbers are decimal
// strings -> NUMERIC(78,0). Canonical identity: block_num = height,
// block_id = indep_hash, parent_id = previous_block.
message Events {
  repeated Block blocks = 1;
  repeated Transaction transactions = 2;
  repeated TransactionTag transaction_tags = 3;
  repeated BlockTag block_tags = 4;
}

message Block {
  option (schema.table) = { name: "blocks" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 height = 10 [(schema.field) = { primary_key: true }];
  bytes indep_hash = 11;
  bytes hash = 12;
  bytes previous_block = 13;
  uint32 ver = 14;
  bytes nonce = 15;
  uint64 block_timestamp = 16;
  uint64 last_retarget = 17;
  string diff = 18 [(schema.field) = { convertTo: { uint256 {} } }];
  string cumulative_diff = 19 [(schema.field) = { convertTo: { uint256 {} } }];
  bytes tx_root = 20;
  bytes wallet_list = 21;
  bytes reward_addr = 22;
  string reward_pool = 23 [(schema.field) = { convertTo: { uint256 {} } }];
  string weave_size = 24 [(schema.field) = { convertTo: { uint256 {} } }];
  string block_size = 25 [(schema.field) = { convertTo: { uint256 {} } }];
  bytes hash_list_merkle = 26;
  optional string poa_option = 27;
  optional bytes poa_tx_path = 28;
  optional bytes poa_data_path = 29;
  optional bytes poa_chunk = 30;
  uint32 num_transactions = 31;
  uint32 num_tags = 32;
}

message Transaction {
  option (schema.table) = { name: "transactions" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  bytes id = 10 [(schema.field) = { primary_key: true }];
  uint32 index = 11;
  uint32 format = 12;
  bytes last_tx = 13;
  bytes owner = 14;
  bytes target = 15;
  string quantity = 16 [(schema.field) = { convertTo: { uint256 {} } }];
  bytes data = 17;
  string data_size = 18 [(schema.field) = { convertTo: { uint256 {} } }];
  bytes data_root = 19;
  bytes signature = 20;
  string reward = 21 [(schema.field) = { convertTo: { uint256 {} } }];
  uint32 num_tags = 22;
}

message TransactionTag {
  option (schema.table) = { name: "transaction_tags" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  bytes tx_id = 10;
  uint32 tx_index = 11;
  uint32 index = 12;
  string name = 13;  // UTF-8 (lossy) rendering of name_bytes
  string value = 14; // UTF-8 (lossy) rendering of value_bytes
  bytes name_bytes = 15;
  bytes value_bytes = 16;
}

message BlockTag {
  option (schema.table) = { name: "block_tags" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint32 index = 10;
  string name = 11;
  string value = 12;
  bytes name_bytes = 13;
  bytes value_bytes = 14;
}
