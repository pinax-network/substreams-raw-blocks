syntax = "proto3";

package pinax.evm.v2;

import "google/protobuf/timestamp.proto";
import "sf/substreams/sink/sql/schema/v1/schema.proto";

// Raw EVM block data, one table per repeated field.
//
// Consumed directly by `substreams sink postgres` (Relational Mappings Mode): every
// repeated field below becomes a table whose name/columns are given by the
// `(schema.table)` / `(schema.field)` annotations. Table and column naming follows
// pinax-network/firehose-parquet (blocks/src/evm/schema.rs) so that Parquet and
// Postgres consumers see the same shape; fields the chain offers beyond that
// schema are appended after tag 30 in each message.
//
// Conventions
// - Every table starts with the canonical identity columns:
//   block_num, block_id, parent_num, parent_id, timestamp, date.
//   (`lib_num` from firehose-parquet is not available inside a Substreams module.)
// - Hashes, addresses and binary payloads are `bytes`. The sink stores them as
//   BYTEA by default, or as text with `--bytes-encoding 0xhex|hex|base64`.
// - uint256 values are decimal strings annotated `uint256` -> NUMERIC(78,0).
// - Enumerations are the Firehose enum names without their prefix
//   (e.g. `EXTENDED`, `LEGACY`, `SUCCEEDED`, `CALL`, `REWARD_MINE_BLOCK`).
// - `system_*` tables hold block-level (non-transaction) data: system calls and
//   the block's own balance/code changes (rewards, withdrawals, ...).
message Events {
  repeated Block blocks = 1;
  repeated Transaction transactions = 2;
  repeated Log logs = 3;
  repeated Call calls = 4;
  repeated BalanceChange balance_changes = 5;
  repeated CodeChange code_changes = 6;
  repeated StorageChange storage_changes = 7;
  repeated NonceChange nonce_changes = 8;
  repeated GasChange gas_changes = 9;
  repeated AccountCreation account_creations = 10;
  repeated KeccakPreimage keccak_preimages = 11;
  repeated AccessListEntry access_lists = 12;
  repeated SetCodeAuthorization set_code_authorizations = 13;
  repeated Uncle uncles = 14;

  repeated SystemCall system_calls = 20;
  repeated SystemBalanceChange system_balance_changes = 21;
  repeated SystemCodeChange system_code_changes = 22;
  repeated SystemStorageChange system_storage_changes = 23;
  repeated SystemNonceChange system_nonce_changes = 24;
  repeated SystemGasChange system_gas_changes = 25;
  repeated SystemAccountCreation system_account_creations = 26;
  repeated SystemKeccakPreimage system_keccak_preimages = 27;
}

// Per-block payload sizes of the Firehose `sf.ethereum.type.v2.Block`, used to
// estimate egress with and without specific data families (see `map_block_sizes`).
message BlockSizes {
  repeated BlockSize block_sizes = 1;
}

message BlockSize {
  option (schema.table) = { name: "block_sizes" };

  uint64 block_num = 1 [(schema.field) = { primary_key: true }];
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  string detail_level = 10;
  // Encoded size of the full Firehose block, in bytes.
  uint64 size_bytes = 11;
  // Encoded size of the same block once every `storage_changes` field is removed.
  uint64 size_without_storage_changes = 12;
  // Bytes attributable to each data family (size_bytes minus the size with that family removed).
  uint64 storage_changes_bytes = 20;
  uint64 keccak_preimages_bytes = 21;
  uint64 gas_changes_bytes = 22;
  uint64 balance_changes_bytes = 23;
  uint64 nonce_changes_bytes = 24;
  uint64 code_changes_bytes = 25;
  uint64 logs_bytes = 26;
  uint64 calls_bytes = 27; // whole `calls` trees (all families + call metadata), transaction receipts kept

  uint32 num_transactions = 40;
  uint32 num_calls = 41;
  uint32 num_logs = 42;
  uint32 num_storage_changes = 43;
  uint32 num_balance_changes = 44;
  uint32 num_gas_changes = 45;
  uint32 num_keccak_preimages = 46;
}

message Block {
  option (schema.table) = { name: "blocks" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 number = 10 [(schema.field) = { primary_key: true }];
  bytes hash = 11;
  bytes parent_hash = 12;
  uint64 gas_used = 13;
  uint64 gas_limit = 14;
  optional string base_fee_per_gas = 15 [(schema.field) = { convertTo: { uint256 {} } }];
  bytes coinbase = 16;
  uint64 size = 17;
  uint64 nonce = 18;
  bytes state_root = 19;
  bytes transactions_root = 20;
  bytes receipt_root = 21;
  optional string difficulty = 22 [(schema.field) = { convertTo: { uint256 {} } }];
  bytes mix_hash = 23;
  bytes extra_data = 24;
  uint32 num_transactions = 25;
  string detail_level = 26;

  bytes uncle_hash = 30;
  bytes logs_bloom = 31;
  optional string total_difficulty = 32 [(schema.field) = { convertTo: { uint256 {} } }];
  bytes withdrawals_root = 33;
  bytes parent_beacon_root = 34;
  optional uint64 blob_gas_used = 35;
  optional uint64 excess_blob_gas = 36;
  bytes requests_hash = 37;
  uint32 num_uncles = 38;
  int32 ver = 39;
}

// Uncle (ommer) block headers included in a block.
message Uncle {
  option (schema.table) = { name: "uncles" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint32 index = 11;
  bytes hash = 12;
  uint64 number = 13;
  bytes parent_hash = 14;
  bytes coinbase = 15;
  optional string difficulty = 16 [(schema.field) = { convertTo: { uint256 {} } }];
  uint64 gas_limit = 17;
  uint64 gas_used = 18;
  google.protobuf.Timestamp uncle_timestamp = 19;
  bytes state_root = 20;
  bytes transactions_root = 21;
  bytes receipt_root = 22;
  bytes mix_hash = 23;
  uint64 nonce = 24;
  bytes extra_data = 25;
}

message Transaction {
  option (schema.table) = { name: "transactions" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint32 index = 11;
  bytes hash = 12 [(schema.field) = { primary_key: true }];
  bytes from = 13;
  bytes to = 14;
  string value = 15 [(schema.field) = { convertTo: { uint256 {} } }];
  uint64 gas_limit = 16;
  uint64 gas_used = 17;
  optional string gas_price = 18 [(schema.field) = { convertTo: { uint256 {} } }];
  string type = 19;
  string status = 20;
  uint64 nonce = 21;
  bytes input = 22;
  optional string max_fee_per_gas = 23 [(schema.field) = { convertTo: { uint256 {} } }];
  optional string max_priority_fee_per_gas = 24 [(schema.field) = { convertTo: { uint256 {} } }];
  optional uint64 cumulative_gas_used = 25;

  bytes v = 30;
  bytes r = 31;
  bytes s = 32;
  bytes public_key = 33;
  bytes return_data = 34;
  uint64 begin_ordinal = 35;
  uint64 end_ordinal = 36;
  optional uint64 blob_gas = 37;
  optional string blob_gas_fee_cap = 38 [(schema.field) = { convertTo: { uint256 {} } }];
  repeated bytes blob_hashes = 39;
  bytes receipt_state_root = 40;
  bytes receipt_logs_bloom = 41;
  optional uint64 receipt_blob_gas_used = 42;
  optional string receipt_blob_gas_price = 43 [(schema.field) = { convertTo: { uint256 {} } }];
  uint32 num_logs = 44;
  uint32 num_calls = 45;
}

// EIP-2930 access list entries of a transaction.
message AccessListEntry {
  option (schema.table) = { name: "access_lists" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint32 tx_index = 12;
  uint32 index = 13;
  bytes address = 14;
  repeated bytes storage_keys = 15;
}

// EIP-7702 set-code authorizations of a transaction.
message SetCodeAuthorization {
  option (schema.table) = { name: "set_code_authorizations" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint32 tx_index = 12;
  uint32 index = 13;
  bool discarded = 14;
  string chain_id = 15 [(schema.field) = { convertTo: { uint256 {} } }];
  bytes address = 16;
  uint64 nonce = 17;
  uint32 v = 18;
  bytes r = 19;
  bytes s = 20;
  optional bytes authority = 21;
}

message Log {
  option (schema.table) = { name: "logs" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint32 tx_index = 12;
  uint32 log_index = 13;
  uint32 block_index = 14;
  bytes address = 15;
  optional bytes topic0 = 16;
  optional bytes topic1 = 17;
  optional bytes topic2 = 18;
  optional bytes topic3 = 19;
  optional bytes data = 20;

  uint64 ordinal = 30;
}

message Call {
  option (schema.table) = { name: "calls" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint32 tx_index = 12;
  uint32 call_index = 13;
  uint32 parent_index = 14;
  uint32 depth = 15;
  string call_type = 16;
  bytes caller = 17;
  bytes address = 18;
  string value = 19 [(schema.field) = { convertTo: { uint256 {} } }];
  uint64 gas_limit = 20;
  uint64 gas_consumed = 21;
  bytes input = 22;
  bytes output = 23;
  bool status_failed = 24;
  bool status_reverted = 25;
  bool state_reverted = 26;
  bool executed_code = 27;
  bool suicide = 28;

  optional bytes address_delegates_to = 30;
  string failure_reason = 31;
  uint64 begin_ordinal = 32;
  uint64 end_ordinal = 33;
}

message BalanceChange {
  option (schema.table) = { name: "balance_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint64 ordinal = 12;
  bytes address = 13;
  string old_value = 14 [(schema.field) = { convertTo: { uint256 {} } }];
  string new_value = 15 [(schema.field) = { convertTo: { uint256 {} } }];
  string reason = 16;

  uint32 tx_index = 30;
  uint32 call_index = 31;
}

message CodeChange {
  option (schema.table) = { name: "code_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint64 ordinal = 12;
  bytes address = 13;
  bytes old_hash = 14;
  bytes new_hash = 15;
  bytes old_code = 16;
  bytes new_code = 17;

  uint32 tx_index = 30;
  uint32 call_index = 31;
}

message StorageChange {
  option (schema.table) = { name: "storage_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint64 ordinal = 12;
  bytes address = 13;
  bytes key = 14;
  bytes old_value = 15;
  bytes new_value = 16;

  uint32 tx_index = 30;
  uint32 call_index = 31;
}

message NonceChange {
  option (schema.table) = { name: "nonce_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint64 ordinal = 12;
  bytes address = 13;
  uint64 old_value = 14;
  uint64 new_value = 15;

  uint32 tx_index = 30;
  uint32 call_index = 31;
}

message GasChange {
  option (schema.table) = { name: "gas_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint64 ordinal = 12;
  uint64 old_value = 13;
  uint64 new_value = 14;
  string reason = 15;

  uint32 tx_index = 30;
  uint32 call_index = 31;
}

message AccountCreation {
  option (schema.table) = { name: "account_creations" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint64 ordinal = 12;
  bytes account = 13;

  uint32 tx_index = 30;
  uint32 call_index = 31;
}

message KeccakPreimage {
  option (schema.table) = { name: "keccak_preimages" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  bytes tx_hash = 11;
  uint32 tx_index = 12;
  uint32 call_index = 13;
  bytes hash = 14;
  bytes preimage = 15;
}

// ---------------------------------------------------------------------------
// System tables: block-level data that is not attached to a transaction.
// ---------------------------------------------------------------------------

message SystemCall {
  option (schema.table) = { name: "system_calls" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint32 call_index = 11;
  uint32 parent_index = 12;
  uint32 depth = 13;
  string call_type = 14;
  bytes caller = 15;
  bytes address = 16;
  string value = 17 [(schema.field) = { convertTo: { uint256 {} } }];
  uint64 gas_limit = 18;
  uint64 gas_consumed = 19;
  bytes input = 20;
  bytes output = 21;
  bool status_failed = 22;
  bool status_reverted = 23;
  bool state_reverted = 24;
  bool executed_code = 25;
  bool suicide = 26;

  optional bytes address_delegates_to = 30;
  string failure_reason = 31;
  uint64 begin_ordinal = 32;
  uint64 end_ordinal = 33;
}

message SystemBalanceChange {
  option (schema.table) = { name: "system_balance_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint64 ordinal = 11;
  bytes address = 12;
  string old_value = 13 [(schema.field) = { convertTo: { uint256 {} } }];
  string new_value = 14 [(schema.field) = { convertTo: { uint256 {} } }];
  string reason = 15;

  // Index of the system call this change belongs to; unset for the block's own
  // balance changes (rewards, withdrawals, ...).
  optional uint32 call_index = 30;
}

message SystemCodeChange {
  option (schema.table) = { name: "system_code_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint64 ordinal = 11;
  bytes address = 12;
  bytes old_hash = 13;
  bytes new_hash = 14;
  bytes old_code = 15;
  bytes new_code = 16;

  optional uint32 call_index = 30;
}

message SystemStorageChange {
  option (schema.table) = { name: "system_storage_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint64 ordinal = 11;
  bytes address = 12;
  bytes key = 13;
  bytes old_value = 14;
  bytes new_value = 15;

  uint32 call_index = 30;
}

message SystemNonceChange {
  option (schema.table) = { name: "system_nonce_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint64 ordinal = 11;
  bytes address = 12;
  uint64 old_value = 13;
  uint64 new_value = 14;

  uint32 call_index = 30;
}

message SystemGasChange {
  option (schema.table) = { name: "system_gas_changes" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint64 ordinal = 11;
  uint64 old_value = 12;
  uint64 new_value = 13;
  string reason = 14;

  uint32 call_index = 30;
}

message SystemAccountCreation {
  option (schema.table) = { name: "system_account_creations" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint64 ordinal = 11;
  bytes account = 12;

  uint32 call_index = 30;
