message SystemKeccakPreimage {
  option (schema.table) = { name: "system_keccak_preimages" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 block_number = 10;
  uint32 call_index = 11;
  bytes hash = 12;
  bytes preimage = 13;
}
