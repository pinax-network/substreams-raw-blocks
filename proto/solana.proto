syntax = "proto3";

package pinax.solana.v2;

import "google/protobuf/timestamp.proto";
import "sf/substreams/sink/sql/schema/v1/schema.proto";

// Raw Solana block data, one table per repeated field, consumed directly by
// `substreams sink postgres` (Relational Mappings Mode). Table and column naming
// follows pinax-network/firehose-parquet (blocks/src/solana/schema.rs); fields beyond
// that schema are appended after tag 30. See proto/evm.proto for the conventions.
//
// Canonical identity: block_num = slot, block_id = blockhash, parent_num = parent_slot,
// parent_id = previous_blockhash. Solana addresses/hashes/signatures are `bytes`
// (use `--bytes-encoding base58` on the sink for the usual text form); mints, owners
// and reward pubkeys are the base58 strings Firehose already carries.
//
// `map_events` reads the vote-stripped block (no `vote_transactions` rows);
// `map_events_with_votes` reads the full block and puts vote transactions in
// `vote_transactions` only (no messages/instructions/token balances for votes).
message Events {
  repeated Block blocks = 1;
  repeated Transaction transactions = 2;
  repeated VoteTransaction vote_transactions = 3;
  repeated Message messages = 4;
  repeated Instruction instructions = 5;
  repeated Reward rewards = 6;
  repeated TokenBalance token_balances = 7;
  repeated AccountLookup account_lookups = 8;
  repeated AccountActivity account_activity = 9;
}

message Block {
  option (schema.table) = { name: "blocks" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 slot = 10 [(schema.field) = { primary_key: true }];
  uint64 parent_slot = 11;
  optional uint64 block_height = 12;
  bytes blockhash = 13;
  bytes previous_blockhash = 14;
  optional int64 block_time = 15;
  uint32 num_transactions = 16;
  uint32 num_rewards = 17;

  uint32 num_successful_transactions = 30;
  uint32 num_failed_transactions = 31;
  uint32 num_vote_transactions = 32;
  uint32 num_successful_vote_transactions = 33;
  uint32 num_failed_vote_transactions = 34;
}

message Transaction {
  option (schema.table) = { name: "transactions" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 slot = 10;
  uint32 transaction_index = 11;
  bytes signature = 12 [(schema.field) = { primary_key: true }];
  uint32 num_signatures = 13;
  uint64 fee = 14;
  optional bytes err = 15;
  bool success = 16;
  optional uint64 compute_units_consumed = 17;
  repeated string log_messages = 18;
  repeated uint64 pre_balances = 19;
  repeated uint64 post_balances = 20;
  optional uint64 cost_units = 21;
  optional bytes return_data_program_id = 22;
  optional bytes return_data = 23;

  repeated bytes signatures = 30;
  optional string error = 31; // decoded TransactionError
  bytes signer = 32;
  uint32 num_instructions = 33;
  uint32 num_inner_instructions = 34;
}

// Same columns as `transactions`, for vote transactions (map_events_with_votes only).
message VoteTransaction {
  option (schema.table) = { name: "vote_transactions" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 slot = 10;
  uint32 transaction_index = 11;
  bytes signature = 12 [(schema.field) = { primary_key: true }];
  uint32 num_signatures = 13;
  uint64 fee = 14;
  optional bytes err = 15;
  bool success = 16;
  optional uint64 compute_units_consumed = 17;
  repeated string log_messages = 18;
  repeated uint64 pre_balances = 19;
  repeated uint64 post_balances = 20;
  optional uint64 cost_units = 21;
  optional bytes return_data_program_id = 22;
  optional bytes return_data = 23;

  repeated bytes signatures = 30;
  optional string error = 31;
  bytes signer = 32;
  uint32 num_instructions = 33;
  uint32 num_inner_instructions = 34;
}

message Message {
  option (schema.table) = { name: "messages" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 slot = 10;
  uint32 transaction_index = 11;
  uint32 message_index = 12;
  uint32 num_required_signatures = 13;
  uint32 num_readonly_signed_accounts = 14;
  uint32 num_readonly_unsigned_accounts = 15;
  bytes recent_blockhash = 16;
  bool versioned = 17;
  repeated bytes account_keys = 18;
  repeated bytes loaded_writable_addresses = 19;
  repeated bytes loaded_readonly_addresses = 20;

  bytes signature = 30;
}

message Instruction {
  option (schema.table) = { name: "instructions" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 slot = 10;
  uint32 transaction_index = 11;
  uint32 instruction_index = 12;
  uint32 program_id_index = 13;
  bytes accounts = 14; // account key indexes, one byte each
  bytes data = 15;
  bool is_inner = 16;
  optional uint32 inner_index = 17; // index of the outer instruction, for inner ones
  optional uint32 stack_height = 18;

  bytes signature = 30;
  bytes program_id = 31;              // resolved from program_id_index
  repeated bytes account_addresses = 32; // resolved from `accounts`
}

message Reward {
  option (schema.table) = { name: "rewards" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 slot = 10;
  uint32 reward_index = 11;
  string pubkey = 12;
  int64 lamports = 13;
  uint64 post_balance = 14;
  string reward_type = 15;
  optional string commission = 16;
  string source = 17; // "block" or "transaction"
  optional uint32 transaction_index = 18;

  uint64 pre_balance = 30;
}

// Pre/post token balances of a transaction.
message TokenBalance {
  option (schema.table) = { name: "token_balances" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 slot = 10;
  uint32 transaction_index = 11;
  uint32 balance_index = 12;
  string balance_type = 13; // "pre" or "post"
  uint32 account_index = 14;
  string mint = 15;
  string owner = 16;
  string program_id = 17;
  string amount = 18 [(schema.field) = { convertTo: { uint128 {} } }];
  optional double ui_amount = 19;
  uint32 decimals = 20;
  string ui_amount_string = 21;

  bytes signature = 30;
  bytes account = 31; // resolved from account_index
}

// Address table lookups of versioned transactions.
message AccountLookup {
  option (schema.table) = { name: "account_lookups" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 slot = 10;
  uint32 transaction_index = 11;
  uint32 lookup_index = 12;
  bytes account_key = 13;
  bytes writable_indexes = 14;
  bytes readonly_indexes = 15;

  bytes signature = 30;
}

// One row per account touched by a transaction: SOL balance change plus the
// matching token balance change when the account is a token account.
message AccountActivity {
  option (schema.table) = { name: "account_activity" };

  uint64 block_num = 1;
  bytes block_id = 2;
  uint64 parent_num = 3;
  bytes parent_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string date = 6;

  uint64 slot = 10;
  uint32 transaction_index = 11;
  bytes signature = 12;
  uint32 account_index = 13;
  bytes address = 14;
  bool signed = 15;
  bool writable = 16;
  bool tx_success = 17;
  uint64 pre_balance = 18;
  uint64 post_balance = 19;
  int64 balance_change = 20;
  optional string token_mint = 21;
  optional string token_owner = 22;
  optional string pre_token_amount = 23 [(schema.field) = { convertTo: { uint128 {} } }];
  optional string post_token_amount = 24 [(schema.field) = { convertTo: { uint128 {} } }];
  optional uint32 token_decimals = 25;
}
