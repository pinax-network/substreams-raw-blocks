specVersion: v0.1.0
package:
  name: raw_blocks_solana
  version: v2.0.0
  image: logo.png
  url: https://github.com/pinax-network/substreams-raw-blocks
  description: |
    Raw Solana block data (blocks, transactions, messages, instructions, rewards, token balances...)
    shaped for `substreams sink postgres`. Table layout follows pinax-network/firehose-parquet.

imports:
  common: https://github.com/streamingfast/substreams-foundational-modules/releases/download/solana-common-v0.4.0/solana-common-v0.4.0.spkg

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/raw_blocks_solana.wasm

protobuf:
  files:
    - solana.proto
  importPaths:
    - ../../proto
  excludePaths:
    - sf/substreams
    - sf/firehose
    - sf/solana # provided by the substreams-solana crate
    - google

modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - map: common:blocks_without_votes
    output:
      type: proto:pinax.solana.v2.Events
  - name: map_events_with_votes
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.solana.type.v1.Block
    output:
      type: proto:pinax.solana.v2.Events

sink:
  module: map_events
  type: sf.substreams.sink.sql.v1.Service
  config:
    engine: postgres
