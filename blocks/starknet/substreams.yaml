specVersion: v0.1.0
package:
  name: raw_blocks_starknet
  version: v2.0.0
  url: https://github.com/pinax-network/substreams-raw-blocks
  description: |
    Raw Starknet block data (blocks, transactions, events, L2->L1 messages, state diffs) shaped for
    `substreams sink postgres`.

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/raw_blocks_starknet.wasm

protobuf:
  files:
    - starknet.proto
    - sf.starknet.type.v1.proto
  importPaths:
    - ../../proto

  excludePaths:
    - sf/substreams
    - sf/firehose
    - google

modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.starknet.type.v1.Block
    output:
      type: proto:pinax.starknet.v2.Events

sink:
  module: map_events
  type: sf.substreams.sink.sql.v1.Service
  config:
    engine: postgres
