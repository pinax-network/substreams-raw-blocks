specVersion: v0.1.0
package:
  name: raw_blocks_antelope
  version: v2.0.0
  image: logo.png
  url: https://github.com/pinax-network/substreams-raw-blocks
  description: |
    Raw Antelope block data (blocks, transactions, actions, db/ram/perm/table ops...) shaped for
    `substreams sink postgres`. Table layout follows pinax-network/firehose-parquet.

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/raw_blocks_antelope.wasm

protobuf:
  files:
    - antelope.proto
  importPaths:
    - ../../proto
  excludePaths:
    - sf/substreams
    - sf/antelope # provided by the substreams-antelope crate
    - sf/firehose
    - google

modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.antelope.type.v1.Block
    output:
      type: proto:pinax.antelope.v2.Events

sink:
  module: map_events
  type: sf.substreams.sink.sql.v1.Service
  config:
    engine: postgres
