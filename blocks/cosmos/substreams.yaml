specVersion: v0.1.0
package:
  name: raw_blocks_cosmos
  version: v2.0.0
  url: https://github.com/pinax-network/substreams-raw-blocks
  description: |
    Raw Cosmos block data (blocks, transactions, events, messages, misbehaviors, validator updates)
    shaped for `substreams sink postgres`. Table layout follows pinax-network/firehose-parquet.

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/raw_blocks_cosmos.wasm

protobuf:
  files:
    - cosmos.proto
  importPaths:
    - ../../proto
  excludePaths:
    - sf/substreams
    - sf/firehose
    - sf/cosmos # provided by the substreams-cosmos crate
    - google

modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.cosmos.type.v2.Block
    output:
      type: proto:pinax.cosmos.v2.Events

sink:
  module: map_events
  type: sf.substreams.sink.sql.v1.Service
  config:
    engine: postgres
