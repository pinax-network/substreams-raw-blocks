specVersion: v0.1.0
package:
  name: raw_blocks_beacon
  version: v2.0.0
  url: https://github.com/pinax-network/substreams-raw-blocks
  description: |
    Raw Ethereum Beacon chain data (blocks, attestations, deposits, slashings, execution payload,
    blobs, withdrawals...) shaped for `substreams sink postgres`. Layout follows pinax-network/firehose-parquet.

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/raw_blocks_beacon.wasm

protobuf:
  files:
    - beacon.proto
    - sf.beacon.type.v1.proto
  importPaths:
    - ../../proto
  excludePaths:
    - sf/substreams
    - sf/firehose
    - google

modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.beacon.type.v1.Block
    output:
      type: proto:pinax.beacon.v2.Events

sink:
  module: map_events
  type: sf.substreams.sink.sql.v1.Service
  config:
    engine: postgres
